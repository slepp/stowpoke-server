# kubectl apply -f kubernetes.yaml
#
# 1. Put the token in a Secret first:
#      kubectl create secret generic stowpoke --from-literal=token="$(openssl rand -base64 32)"
# 2. Apply this file.
# 3. Expose it over HTTPS with your Ingress or Gateway; the README has an nginx example.
#
# One replica, one volume: SQLite expects a single writer. The Deployment uses
# Recreate so a new pod never runs beside the old one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stowpoke
  labels:
    app: stowpoke
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stowpoke
  template:
    metadata:
      labels:
        app: stowpoke
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stowpoke
          image: ghcr.io/slepp/stowpoke-server:latest
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stowpoke
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stowpoke-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stowpoke-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stowpoke
  labels:
    app: stowpoke
spec:
  selector:
    app: stowpoke
  ports:
    - name: http
      port: 80
      targetPort: http
